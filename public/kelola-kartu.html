<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Kelola kartu – UlasKu</title></head><body><main class="box">
<h1>Kelola kartu</h1><p id="sub">Masukkan kode kartu dan PIN untuk mengubah nama bisnis, link review, PIN, atau mereset kartu.</p>
<form id="login" autocomplete="off">
<label for="c">Kode kartu</label><input id="c" placeholder="Contoh: ZWA82G" autocapitalize="characters" required>
<button type="button" class="ghost" id="scan">Scan QR di kartu</button>
<video id="v" class="hide" playsinline muted style="width:100%;border-radius:12px;margin-top:12px"></video>
<label for="p">PIN</label><input id="p" type="password" inputmode="numeric" maxlength="6" required>
<button id="b">Masuk</button><div id="m" class="msg" role="status"></div></form>
<form id="edit" class="hide" autocomplete="off">
<div class="stat"><b id="s">0</b><span style="color:var(--mut)">kali kartu dipakai</span></div>
<label for="n">Nama bisnis</label><input id="n" maxlength="80" required>
<label for="u">Link Google Review</label><input id="u" type="url" required>
<label for="np">PIN baru (kosongkan jika tidak diganti)</label><input id="np" type="password" inputmode="numeric" maxlength="6">
<button id="sv">Simpan perubahan</button>
<button type="button" class="danger" id="rs">Reset kartu</button><div id="m2" class="msg" role="status"></div></form>
</main><script src="/app.js"></script><script>
const $=i=>document.getElementById(i);let C='',P='';
$('c').value=parseCode(new URLSearchParams(location.search).get('code')||'');
$('c').onchange=()=>$('c').value=parseCode($('c').value);
$('login').onsubmit=async e=>{e.preventDefault();C=parseCode($('c').value);P=$('p').value;$('b').disabled=true;
 try{const d=await api({action:'load',code:C,pin:P});$('n').value=d.name;$('u').value=d.reviewUrl;$('s').textContent=d.scans;
  $('login').classList.add('hide');$('edit').classList.remove('hide');$('sub').textContent='Kartu '+C}
 catch(x){show($('m'),'err',x.message)}$('b').disabled=false};
$('edit').onsubmit=async e=>{e.preventDefault();
 try{await api({action:'update',code:C,pin:P,name:$('n').value,reviewUrl:$('u').value,newPin:$('np').value});if($('np').value)P=$('np').value;$('np').value='';show($('m2'),'ok','Perubahan tersimpan.')}
 catch(x){show($('m2'),'err',x.message)}};
$('rs').onclick=async()=>{if(!confirm('Reset kartu? Data bisnis dihapus dan kartu perlu diaktifkan ulang.'))return;
 try{await api({action:'reset',code:C,pin:P});location.href='/aktivasi?code='+C}catch(x){show($('m2'),'err',x.message)}};
$('scan').onclick=async()=>{
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices){show($('m'),'err','Browser ini belum bisa scan. Ketik kode kartu secara manual.');return}
 const v=$('v'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=st;v.classList.remove('hide');await v.play();
 const d=new BarcodeDetector({formats:['qr_code']});
 const t=setInterval(async()=>{const r=await d.detect(v).catch(()=>[]);if(r.length){clearInterval(t);st.getTracks().forEach(x=>x.stop());v.classList.add('hide');$('c').value=parseCode(r[0].rawValue);$('p').focus()}},400)};
</script></body></html>
